server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 server_tokens off;
 client_max_body_size 1m;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy no-referrer always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
 location = /healthz { access_log off; default_type application/json; return 200 '{"status":"ok"}'; }
 location = /api/health/ready { proxy_pass http://api:8081; }
 location = /metrics { return 404; }
 location /api/ { proxy_pass http://api:8081; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 30s; }
 location / { try_files $uri $uri/ /index.html; }
}
