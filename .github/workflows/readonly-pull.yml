name: Verify and cache reviewed digests (read only, no deploy)
on:
  push:
    branches: [plan/active-homologation-rc2]
    paths:
      - .github/workflows/readonly-pull.yml
      - scripts/verify-release-pull.py
      - scripts/request-registry-pull.py
      - deploy/release-manifest.fallback.json
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  verify-and-pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Isolate registry login on ephemeral runner
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -eu
          umask 077
          auth_dir=$(mktemp -d "$RUNNER_TEMP/configsentinel-readonly.XXXXXXXX")
          echo "DOCKER_CONFIG=$auth_dir" >> "$GITHUB_ENV"
          printf '%s' "$GHCR_TOKEN" | docker --config "$auth_dir" login ghcr.io -u franklinlem --password-stdin
      - name: Install pinned verification tools
        run: |
          set -eu
          curl -fsSL -o /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz
          echo 'c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0  /tmp/trivy.tar.gz' | sha256sum --check
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          curl -fsSL -o /tmp/cosign https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64
          echo '424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa  /tmp/cosign' | sha256sum --check
          chmod 700 /tmp/cosign
      - name: Verify five exact digests, signatures, SBOMs, provenance and scans
        run: python3 scripts/verify-release-pull.py
        env:
          COSIGN_BIN: /tmp/cosign
          TRIVY_BIN: /tmp/trivy
      - name: Cache verified images through existing restricted SSH command
        run: |
          python3 scripts/request-registry-pull.py --manifest deploy/release-manifest.candidate.json
          python3 scripts/request-registry-pull.py --manifest deploy/release-manifest.fallback.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULL_SSH_KEY: ${{ secrets.CONFIGSENTINEL_PULL_SSH_KEY }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: readonly-pull-evidence
          path: .local/readonly-pull/
          retention-days: 30
      - name: Remove only ephemeral runner authentication
        if: always()
        run: |
          if test -n "${DOCKER_CONFIG:-}"; then
            case "$DOCKER_CONFIG" in "$RUNNER_TEMP"/configsentinel-readonly.*) rm -rf -- "$DOCKER_CONFIG" ;; *) exit 1 ;; esac
          fi
