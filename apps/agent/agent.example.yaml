agent:
  server_url: https://configsentinel-dev.franklem.uk/api/v1
  agent_id: 00000000-0000-4000-8000-000000000001
  token_file: /etc/configsentinel/agent.token
  interval_seconds: 60
  max_file_bytes: 10485760
  max_files: 100
  max_queue_events: 10000
  queue_db: /var/lib/configsentinel/events.sqlite
  send_batch_size: 100
monitoring:
  files:
    - path: /opt/configsentinel-lab/demo.conf
      alias: laboratorio-demo
      hash_only: true
  deny_prefixes: []
  deny_globs: []
